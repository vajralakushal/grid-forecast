[project]
name = "grid-forecast"
version = "0.1.0"
description = "Probabilistic day-ahead load forecasting for PJM, benchmarked against the operator's own forecast."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
]

# Model libraries are a separate group so the daily weather collector stays light
# (uv sync --no-default-groups). Plain `uv sync` installs everything.
[dependency-groups]
models = [
    "lightgbm>=4.7.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "statsforecast>=2.0.2",
    "prophet>=1.5.0",
    "chronos-forecasting>=2.0",
    "timesfm[torch]>=3.0",
    "torch>=2.8",
]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=8",
]

[tool.uv]
default-groups = ["dev", "models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridfc"]

# Linux (CI, GitHub Actions) gets CPU-only torch: the default wheel pulls ~2-3 GB of
# CUDA libraries that no job here uses. macOS wheels from PyPI are CPU/MPS already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
