[project]
name = "grid-forecast"
version = "0.1.0"
description = "Probabilistic day-ahead load forecasting for PJM, benchmarked against the operator's own forecast."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.7.2",
    "statsforecast>=2.0.2",
    "prophet>=1.5.0",
    "chronos-forecasting>=2.0",
    "timesfm[torch]>=3.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridfc"]
